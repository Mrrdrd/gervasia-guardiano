name: Chi parla
version: "1.0.2"
slug: chi_parla
description: >-
  Speech to text for Gervàsia that also recognises who is speaking. Audio goes on
  to Home Assistant Cloud as before; a local CAM++ model compares the voice with
  the family's voiceprints and writes the name to input_text.chi_parla.
url: https://github.com/Mrrdrd/gervasia-guardiano
arch:
  - amd64
init: false
boot: auto
startup: services
homeassistant_api: true
ports:
  10400/tcp: null
map:
  - type: share
    read_only: false
  - type: homeassistant_config
    read_only: true
options:
  stt_entity: stt.home_assistant_cloud
  helper: input_text.chi_parla
  voiceprints: /share/chi_parla/voiceprints.json
  log_file: /share/chi_parla/log.jsonl
  enroll_zip: /share/chi_parla/registrazioni.zip
  min_score: 0.35
  min_margin: 0.10
schema:
  stt_entity: str
  helper: str
  voiceprints: str
  log_file: str
  enroll_zip: str
  min_score: float
  min_margin: float
